[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfd"
version = "0.1.0"
description = "Graph-Transformer Fraud Detector with Self-Supervised Pretraining and Conformal Risk Control"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "GTFD Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "torch==2.3.1",
    "torch-geometric==2.5.3",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-cluster==1.6.3",
    "torch-spline-conv==1.2.2",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.3",
    "omegaconf==2.3.0",
    "pyyaml==6.0.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.0",
    "scikit-learn==1.5.0",
    "matplotlib==3.8.4",
    "plotly==5.22.0",
    "networkx==3.3",
    "seaborn==0.13.2",
    "loguru==0.7.2",
    "typer==0.12.3",
    "tqdm==4.66.4",
    "rich==13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "hypothesis==6.100.0",
    "black==24.4.2",
    "ruff==0.4.4",
    "mypy==1.10.0",
]
viz = [
    "umap-learn==0.5.5",
]
jupyter = [
    "jupyter==1.0.0",
    "ipykernel==6.29.5",
]

[project.scripts]
gtfd-generate = "scripts.generate_data:main"
gtfd-pretrain = "scripts.pretrain:main"
gtfd-calibrate = "scripts.calibrate:main"
gtfd-evaluate = "scripts.evaluate:main"
gtfd-stress = "scripts.stress_test:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gtfd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "gpu: marks tests requiring GPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "ANN", "T20"]
ignore = ["ANN101", "ANN102", "ANN103", "T201", "T203"]
per-file-ignores = { "tests/*": ["S101", "T201", "T203"] }

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
